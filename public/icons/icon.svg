<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#1877f2"/>

  <!-- Main share icon - three dots connected by lines (representing sharing to multiple groups) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center dot (source post) -->
    <circle cx="64" cy="44" r="8" fill="#FFFFFF"/>

    <!-- Three target dots (groups) -->
    <circle cx="34" cy="84" r="8" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="64" cy="92" r="8" fill="#FFFFFF"/>
    <circle cx="94" cy="84" r="8" fill="#FFFFFF" opacity="0.9"/>

    <!-- Connection lines from center to targets -->
    <path d="M64 52 L38 76" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
    <path d="M64 52 L64 84" stroke="#FFFFFF" stroke-width="4"/>
    <path d="M64 52 L90 76" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
  </g>

  <!-- Subtle pulse rings around target dots (suggesting broadcast/distribution) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4">
    <circle cx="34" cy="84" r="14"/>
    <circle cx="64" cy="92" r="14"/>
    <circle cx="94" cy="84" r="14"/>
  </g>
</svg>