<!DOCTYPE html>
<html>
<head>
  <title>Generate Icons</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .icon-row { display: flex; gap: 20px; margin-bottom: 20px; align-items: center; }
    canvas { border: 1px solid #ddd; background: #fafafa; }
    button { padding: 10px 20px; background: #1877f2; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0d65d9; }
    a { display: inline-block; margin: 5px; padding: 8px 16px; background: #42b72a; color: white; text-decoration: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Free Group Poster - Icon Generator</h1>
  <p>Click "Draw Icons" to render the SVG to canvases, then click "Download" links to save as PNG.</p>

  <button onclick="drawAll()">Draw All Icons</button>

  <div class="icon-row">
    <div>
      <h3>16x16</h3>
      <canvas id="c16" width="16" height="16"></canvas>
      <br><a id="d16" href="#" download="icon16.png" style="display:none">Download 16x16</a>
    </div>
    <div>
      <h3>32x32</h3>
      <canvas id="c32" width="32" height="32"></canvas>
      <br><a id="d32" href="#" download="icon32.png" style="display:none">Download 32x32</a>
    </div>
    <div>
      <h3>48x48</h3>
      <canvas id="c48" width="48" height="48"></canvas>
      <br><a id="d48" href="#" download="icon48.png" style="display:none">Download 48x48</a>
    </div>
    <div>
      <h3>128x128</h3>
      <canvas id="c128" width="128" height="128"></canvas>
      <br><a id="d128" href="#" download="icon128.png" style="display:none">Download 128x128</a>
    </div>
  </div>

  <script>
    const svg = `
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="24" fill="url(#gradient)"/>
  <path d="M96 40a16 16 0 0 1-16 16H32a16 16 0 0 1-16-16V24a16 16 0 0 1 16-16h48a16 16 0 0 1 16 16v16z" fill="white"/>
  <polyline points="72 16 96 16 96 40" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M40 64h48M40 84h32M40 104h24" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1877f2"/>
      <stop offset="100%" stop-color="#0d65d9"/>
    </linearGradient>
  </defs>
</svg>`;

    const sizes = [16, 32, 48, 128];

    function drawAll() {
      const img = new Image();
      img.onload = () => {
        sizes.forEach(size => {
          const canvas = document.getElementById('c' + size);
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, size, size);
          const link = document.getElementById('d' + size);
          link.href = canvas.toDataURL('image/png');
          link.style.display = 'inline-block';
        });
      };
      img.src = 'data:image/svg+xml;base64,' + btoa(svg);
    }
  </script>
</body>
</html>
